name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# =====================================================================
# STAGE 1: Lint & Format
# =====================================================================
jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff lint check
        run: |
          ruff check app/ mcp_server/ memory/ evaluation/ tests/ \
            --output-format=github

      - name: Ruff format check
        run: |
          ruff format --check app/ mcp_server/ memory/ evaluation/ tests/

      - name: MyPy type check
        run: |
          mypy app/ mcp_server/ memory/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --warn-unused-ignores \
            --warn-redundant-casts

  # ===================================================================
  # STAGE 2: Unit Tests
  # ===================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    env:
      CHROMA_MODE: ephemeral
      DATABASE_AUTO_CREATE_TABLES: "false"
      ENVIRONMENT: test
      LOG_LEVEL: DEBUG

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=app \
            --cov=mcp_server \
            --cov=memory \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            --junitxml=junit-unit.xml

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            junit-unit.xml
            coverage-unit.xml
          retention-days: 14

  # ===================================================================
  # STAGE 3: Integration Tests (PostgreSQL + ChromaDB)
  # ===================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: robot_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/robot_agent_test
      DATABASE_AUTO_CREATE_TABLES: "true"
      CHROMA_MODE: ephemeral
      ENVIRONMENT: test
      LOG_LEVEL: DEBUG
      AGENT_ENABLE_MEMORY: "true"
      AGENT_ENABLE_VERIFICATION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            --cov=app \
            --cov=mcp_server \
            --cov=memory \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing \
            --junitxml=junit-integration.xml

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            junit-integration.xml
            coverage-integration.xml
          retention-days: 14

  # ===================================================================
  # STAGE 4: MCP Tools Smoke Test
  # ===================================================================
  mcp-smoke-test:
    name: MCP Tools Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    env:
      CHROMA_MODE: ephemeral
      ENVIRONMENT: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MCP tools smoke test
        run: |
          python -c "
          from mcp_server.tools import SimulatedRobotBackend

          backend = SimulatedRobotBackend()

          # Test get_state
          state = backend.get_state()
          assert state['success'] is True, f'get_state failed: {state}'
          print('✓ robot_get_state')

          # Test list_objects
          objects = backend.list_objects()
          assert objects['success'] is True, f'list_objects failed: {objects}'
          print('✓ robot_list_objects')

          # Test detect_object
          detect = backend.detect_object('red_cup')
          assert detect['success'] is True, f'detect_object failed: {detect}'
          print('✓ robot_detect_object')

          # Test move_to
          move = backend.move_to('red_cup')
          assert move['success'] is True, f'move_to failed: {move}'
          print('✓ robot_move_to')

          # Test grasp_object
          grasp = backend.grasp_object('red_cup')
          assert grasp['success'] is True, f'grasp_object failed: {grasp}'
          print('✓ robot_grasp_object')

          # Test verify_object_location (gripper)
          verify1 = backend.verify_object_location('red_cup', 'gripper')
          assert verify1['success'] is True, f'verify failed: {verify1}'
          assert verify1['data']['verified'] is True, 'Object not in gripper'
          print('✓ robot_verify_object_location (gripper)')

          # Test move to target
          move2 = backend.move_to('kitchen_counter')
          assert move2['success'] is True, f'move_to failed: {move2}'
          print('✓ robot_move_to (kitchen_counter)')

          # Test release_object
          release = backend.release_object('kitchen_counter')
          assert release['success'] is True, f'release failed: {release}'
          print('✓ robot_release_object')

          # Test verify_object_location (target)
          verify2 = backend.verify_object_location('red_cup', 'kitchen_counter')
          assert verify2['success'] is True, f'verify failed: {verify2}'
          assert verify2['data']['verified'] is True, 'Object not at target'
          print('✓ robot_verify_object_location (kitchen_counter)')

          # Test fault injection
          backend.reset_scene()
          backend.inject_fault('grasp_object')
          backend.move_to('red_cup')
          fail_grasp = backend.grasp_object('red_cup')
          assert fail_grasp['success'] is False, 'Fault injection did not work'
          assert fail_grasp['error_code'] == 'GRASP_FAILED'
          print('✓ fault injection')

          print()
          print('All MCP smoke tests passed!')
          "

  # ===================================================================
  # STAGE 5: Agent End-to-End Test (no LLM key required)
  # ===================================================================
  agent-e2e-test:
    name: Agent E2E Test (Heuristic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests, mcp-smoke-test]

    env:
      CHROMA_MODE: ephemeral
      ENVIRONMENT: test
      LOG_LEVEL: INFO

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run heuristic E2E test (no LLM key)
        run: |
          python -c "
          import asyncio
          from app.agent.executor import RobotExecutor, SimulatedMCPToolInvoker

          async def main():
              executor = RobotExecutor()
              invoker = SimulatedMCPToolInvoker()

              result = await executor.execute_task(
                  instruction=(
                      'Take the red cup on the table, '
                      'put it on the kitchen counter, '
                      'and verify the process is complete.'
                  ),
                  tool_invoker=invoker,
                  baseline='full_system',
              )

              print(f'Task: {result.task_name}')
              print(f'Success: {result.success}')
              print(f'Status: {result.status}')
              print(f'Duration: {result.duration_ms}ms')
              print(f'Recovery attempts: {result.recovery_attempts}')
              print(f'Retry count: {result.retry_count}')
              print(f'Metrics: {result.metrics}')
              print()

              for i, step in enumerate(result.steps, 1):
                  status_icon = '✓' if step.success else '✗'
                  print(f'  {status_icon} Step {i}: {step.tool_name} ({step.duration_ms}ms)')

              assert result.success is True, f'Task failed: {result.error_message}'
              print()
              print('E2E heuristic test passed!')

          asyncio.run(main())
          "

  # ===================================================================
  # STAGE 6: Evaluation Baselines (with LLM if key available)
  # ===================================================================
  evaluation:
    name: Baseline Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [agent-e2e-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      CHROMA_MODE: ephemeral
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run baseline evaluation
        run: |
          python -c "
          import asyncio
          import json
          from app.agent.executor import RobotExecutor, SimulatedMCPToolInvoker

          TASK = (
              'Take the red cup on the table, '
              'put it on the kitchen counter, '
              'and verify the process is complete.'
          )

          BASELINES = ['baseline_a', 'baseline_b', 'baseline_c', 'full_system']
          ITERATIONS = 2

          async def main():
              executor = RobotExecutor()
              invoker = SimulatedMCPToolInvoker()
              results = {}

              for baseline in BASELINES:
                  results[baseline] = []
                  for i in range(ITERATIONS):
                      invoker = SimulatedMCPToolInvoker()  # fresh state
                      result = await executor.execute_task(
                          instruction=TASK,
                          tool_invoker=invoker,
                          baseline=baseline,
                      )
                      results[baseline].append({
                          'iteration': i + 1,
                          'success': result.success,
                          'duration_ms': result.duration_ms,
                          'recovery_attempts': result.recovery_attempts,
                          'retry_count': result.retry_count,
                          'status': result.status,
                      })
                      print(
                          f'{baseline} iter={i+1} '
                          f'success={result.success} '
                          f'duration={result.duration_ms}ms'
                      )

              # Summary
              print()
              print('=' * 60)
              print('EVALUATION SUMMARY')
              print('=' * 60)

              for baseline in BASELINES:
                  runs = results[baseline]
                  successes = sum(1 for r in runs if r['success'])
                  total = len(runs)
                  avg_dur = sum(r['duration_ms'] for r in runs) / total
                  print(
                      f'{baseline:15s} | '
                      f'success={successes}/{total} | '
                      f'avg_duration={avg_dur:.0f}ms'
                  )

              # Save report
              with open('evaluation_report.json', 'w') as f:
                  json.dump(results, f, indent=2)

              print()
              print('Evaluation report saved to evaluation_report.json')

          asyncio.run(main())
          "

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: evaluation_report.json
          retention-days: 30

  # ===================================================================
  # STAGE 7: Docker Build & Push
  # ===================================================================
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests, integration-tests, mcp-smoke-test]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  # ===================================================================
  # STAGE 8: API Smoke Test (Docker)
  # ===================================================================
  api-smoke-test:
    name: API Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start services
        run: |
          docker compose up --build -d postgres chromadb api
          sleep 15

      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "API is healthy!"
              break
            fi
            echo "Waiting for API... attempt $i"
            sleep 2
          done

      - name: Test health endpoint
        run: |
          RESPONSE=$(curl -sf http://localhost:8000/health)
          echo "$RESPONSE" | python -m json.tool
          echo "$RESPONSE" | grep -q '"status":"ok"'

      - name: Test task execution endpoint
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:8000/tasks/run \
            -H "Content-Type: application/json" \
            -d '{
              "instruction": "Take the red cup on the table, put it on the kitchen counter, and verify the process is complete.",
              "baseline": "full_system"
            }')
          echo "$RESPONSE" | python -m json.tool
          echo "$RESPONSE" | grep -q '"success":true'

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs api
          docker compose logs postgres
          docker compose logs chromadb

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v

  # ===================================================================
  # STAGE 9: Coverage Report
  # ===================================================================
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-tests, integration-tests]
    if: always()

    steps:
      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: artifacts/unit/

      - name: Download integration test coverage
        uses: actions/download-artifact@v4
        with:
          name: integration-test-results
          path: artifacts/integration/

      - name: Display coverage summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f artifacts/unit/coverage-unit.xml ]; then
            echo "### Unit Tests" >> $GITHUB_STEP_SUMMARY
            echo "Coverage report generated." >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f artifacts/integration/coverage-integration.xml ]; then
            echo "### Integration Tests" >> $GITHUB_STEP_SUMMARY
            echo "Coverage report generated." >> $GITHUB_STEP_SUMMARY
          fi
