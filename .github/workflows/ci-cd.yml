name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.11"

# ------------------------------------------------------------------
# Permissions for GitHub Container Registry
# ------------------------------------------------------------------
permissions:
  contents: read
  packages: write

jobs:
  # ==================================================================
  # JOB 2: Test Suite
  # ==================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # PostgreSQL service container for integration tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_robot_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_robot_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    env:
      # Application
      ENVIRONMENT: test
      DEBUG: "false"
      LOG_LEVEL: INFO
      AGENT_VERSION: "0.1.0-test"

      # Database (points to service container)
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_robot_agent
      DATABASE_AUTO_CREATE_TABLES: "true"
      DATABASE_ECHO: "false"
      DATABASE_POOL_SIZE: "3"
      DATABASE_MAX_OVERFLOW: "5"

      # LLM - pulled from GitHub Secrets
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
      LLM_TEMPERATURE: "0.0"
      LLM_MAX_TOKENS: "1024"

      # MCP
      MCP_ROBOT_BACKEND: simulated
      MCP_TRANSPORT: stdio

      # ChromaDB - ephemeral for tests
      CHROMA_MODE: ephemeral
      CHROMA_COLLECTION: test_robot_experiences
      CHROMA_DISTANCE: cosine

      # Agent behavior
      AGENT_MAX_PLAN_STEPS: "8"
      AGENT_MAX_ACTION_RETRIES: "2"
      AGENT_ENABLE_VERIFICATION: "true"
      AGENT_ENABLE_MEMORY: "true"

      # Evaluation
      EVALUATION_BASELINE: full_system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Verify LLM_API_KEY is available
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::warning::LLM_API_KEY is not set. Tests will use heuristic planner."
          else
            echo "LLM_API_KEY is configured."
          fi

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready."

      - name: Run unit tests
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --asyncio-mode=auto \
            -x \
            --timeout=120

      - name: Run integration tests with coverage
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --asyncio-mode=auto \
            --cov=app \
            --cov=mcp_server \
            --cov=memory \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

      - name: Test API startup
        run: |
          timeout 30 python -c "
          import asyncio
          from app.main import app
          from httpx import AsyncClient, ASGITransport

          async def test_startup():
              transport = ASGITransport(app=app)
              async with AsyncClient(transport=transport, base_url='http://test') as client:
                  response = await client.get('/health')
                  assert response.status_code == 200, f'Health check failed: {response.text}'
                  data = response.json()
                  assert data['status'] == 'ok'
                  print(f'API health check passed: {data}')

          asyncio.run(test_startup())
          "

  # ==================================================================
  # JOB 3: Docker Build & Push
  # ==================================================================
  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Run container smoke test
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "Running smoke test on image: $IMAGE_TAG"

          # Start container with LLM_API_KEY from secrets
          docker run -d \
            --name agent_smoke_test \
            -p 8080:8000 \
            -e ENVIRONMENT=production \
            -e LLM_API_KEY="$LLM_API_KEY" \
            -e LLM_MODEL=gpt-4o-mini \
            -e DATABASE_URL=postgresql+asyncpg://test:test@localhost:5432/test \
            -e CHROMA_MODE=ephemeral \
            -e AGENT_ENABLE_MEMORY=false \
            "$IMAGE_TAG"

          # Wait for container to start
          echo "Waiting for container to start..."
          sleep 10

          # Health check
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || echo "000")

          if [ "$RESPONSE" = "200" ]; then
            echo "Smoke test passed: HTTP $RESPONSE"
            curl -s http://localhost:8080/health | python -m json.tool
          else
            echo "::error::Smoke test failed with HTTP $RESPONSE"
            docker logs agent_smoke_test
            exit 1
          fi

          # Cleanup
          docker stop agent_smoke_test
          docker rm agent_smoke_test

      - name: Verify image in registry
        run: |
          echo "Image pushed successfully:"
          echo "  Registry: ${{ env.REGISTRY }}"
          echo "  Image: ${{ env.IMAGE_NAME }}"
          echo "  SHA: ${{ github.sha }}"
          echo "  Ref: ${{ github.ref }}"

  # ==================================================================
  # JOB 4: Notify (optional)
  # ==================================================================
  notify:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, test, docker-build-push]
    if: always()

    steps:
      - name: Pipeline summary
        run: |
          echo "=========================================="
          echo "  CI/CD Pipeline Summary"
          echo "=========================================="
          echo "  Repository: ${{ github.repository }}"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Triggered by: ${{ github.event_name }}"
          echo "  Actor: ${{ github.actor }}"
          echo "=========================================="
          echo "  Lint: ${{ needs.lint.result }}"
          echo "  Test: ${{ needs.test.result }}"
          echo "  Docker: ${{ needs.docker-build-push.result }}"
          echo "=========================================="
