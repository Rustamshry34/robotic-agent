name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.11"

# ------------------------------------------------------------------
# Permissions for GitHub Container Registry
# ------------------------------------------------------------------
permissions:
  contents: read
  packages: write

jobs:
  # ==================================================================
  # JOB 1: Lint & Static Analysis
  # ==================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
  # ==================================================================
  # JOB 2: Test Suite with Coverage
  # ==================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_robot_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_robot_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    env:
      ENVIRONMENT: test
      DEBUG: "false"
      LOG_LEVEL: INFO
      AGENT_VERSION: "0.1.0-test"

      USE_LLM_IN_TESTS: "false"  # ← YENİ SATIR

      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_robot_agent
      DATABASE_AUTO_CREATE_TABLES: "true"
      DATABASE_ECHO: "false"
      DATABASE_POOL_SIZE: "3"
      DATABASE_MAX_OVERFLOW: "5"

      LLM_PROVIDER: transformers
      LLM_MODEL: NicholasCorrado/tinyllama-1.1b-chat-v1.0-ui-math-coding-group-dpo
      LLM_TEMPERATURE: "0.0"
      LLM_MAX_TOKENS: "1024"

      MCP_ROBOT_BACKEND: simulated
      MCP_TRANSPORT: stdio

      CHROMA_MODE: ephemeral
      CHROMA_COLLECTION: test_robot_experiences
      CHROMA_DISTANCE: cosine

      AGENT_MAX_PLAN_STEPS: "8"
      AGENT_MAX_ACTION_RETRIES: "2"
      AGENT_ENABLE_VERIFICATION: "true"
      AGENT_ENABLE_MEMORY: "true"

      EVALUATION_BASELINE: full_system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout httpx

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready."

      - name: Run all tests with coverage
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --asyncio-mode=auto \
            --cov=app \
            --cov=mcp_server \
            --cov=memory \
            --cov=evaluation \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-fail-under=60

      - name: Upload coverage XML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

      - name: Upload coverage HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

      - name: Test API startup
        run: |
          timeout 30 python -c "
          import asyncio
          from app.main import app
          from httpx import AsyncClient, ASGITransport

          async def test_startup():
              transport = ASGITransport(app=app)
              async with AsyncClient(transport=transport, base_url='http://test') as client:
                  response = await client.get('/health')
                  assert response.status_code == 200, f'Health check failed: {response.text}'
                  data = response.json()
                  assert data['status'] == 'ok'
                  print(f'API health check passed: {data}')

          asyncio.run(test_startup())
          "

  # ==================================================================
  # JOB 3: Coverage Summary
  # ==================================================================
  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download coverage XML
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install coverage
        run: pip install coverage

      - name: Generate coverage summary
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          import os

          tree = ET.parse('coverage.xml')
          root = tree.getroot()

          line_rate = float(root.attrib.get('line-rate', 0))
          branch_rate = float(root.attrib.get('branch-rate', 0))
          lines_valid = int(root.attrib.get('lines-valid', 0))
          lines_covered = int(root.attrib.get('lines-covered', 0))

          coverage_pct = line_rate * 100

          summary = f'''## 📊 Coverage Report

          - **Line Coverage**: {coverage_pct:.2f}% ({lines_covered}/{lines_valid} lines)
          - **Branch Coverage**: {branch_rate * 100:.2f}%
          - **Status**: {'✅ PASS' if coverage_pct >= 60 else '❌ FAIL'}

          ### Coverage by Module
          '''

          for package in root.findall('.//package'):
              pkg_name = package.attrib.get('name', 'unknown')
              pkg_line_rate = float(package.attrib.get('line-rate', 0))
              summary += f'- `{pkg_name}`: {pkg_line_rate * 100:.2f}%\n'

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(summary)
          "

  # ==================================================================
  # JOB 4: Evaluation Pipeline
  # ==================================================================
  evaluation:
    name: Run Baseline Evaluation
    runs-on: ubuntu-latest
    needs: test

    env:
      ENVIRONMENT: test
      LOG_LEVEL: INFO

      USE_LLM_IN_TESTS: "true"  # ← YENİ SATIR

      # LLM (Local Transformers - API key gerekmez)
      LLM_PROVIDER: transformers
      LLM_MODEL: NicholasCorrado/tinyllama-1.1b-chat-v1.0-ui-math-coding-group-dpo
      LLM_DEVICE: cpu
      LLM_DTYPE: float32
      LLM_TEMPERATURE: "0.0"
      LLM_MAX_TOKENS: "1024"

      MCP_ROBOT_BACKEND: simulated
      MCP_TRANSPORT: stdio

      CHROMA_MODE: ephemeral
      CHROMA_COLLECTION: eval_robot_experiences
      CHROMA_DISTANCE: cosine

      AGENT_MAX_PLAN_STEPS: "12"
      AGENT_MAX_ACTION_RETRIES: "3"
      AGENT_ENABLE_VERIFICATION: "true"
      AGENT_ENABLE_MEMORY: "true"

      EVALUATION_BASELINE: full_system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run baseline evaluation experiment
        run: |
          python -m evaluation.baselines \
            --instruction "Take the red cup on the table and put it on the kitchen counter" \
            --baselines baseline_a baseline_b baseline_c full_system \
            --iterations 3 \
            --seed 42 \
            --strict-llm \
            --output eval_results.json \
            --log-level INFO

      - name: Generate evaluation reports
        run: |
          python -c "
          import asyncio
          import json
          from pathlib import Path
          from evaluation.baselines import ExperimentResult
          from evaluation.metrics import ReportGenerator

          async def generate_reports():
              with open('eval_results.json', 'r') as f:
                  data = json.load(f)
              
              result = ExperimentResult(**data)
              reporter = ReportGenerator(result)
              
              reporter.generate_markdown('eval_report.md')
              reporter.generate_csv('eval_raw_data.csv')
              
              print('Reports generated successfully!')

          asyncio.run(generate_reports())
          "

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: |
            eval_results.json
            eval_report.md
            eval_raw_data.csv
          retention-days: 30

      - name: Display evaluation summary
        run: |
          if [ -f eval_report.md ]; then
            cat eval_report.md >> $GITHUB_STEP_SUMMARY
          fi

  # ==================================================================
  # JOB 5: Docker Build & Push
  # ==================================================================
  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: evaluation
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Run container smoke test with environment variables
        env:
          LLM_MODEL: ${{ vars.LLM_MODEL || 'NicholasCorrado/tinyllama-1.1b-chat-v1.0-ui-math-coding-group-dpo' }}
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          # Tam SHA'dan ilk 7 karakteri al (kısa SHA)
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          
          IMAGE_TAG="${{ env.REGISTRY }}/${IMAGE_NAME_LOWER}:sha-${{ github.sha }}"
          
          echo "Running smoke test on image: $IMAGE_TAG"

          # Start container with comprehensive environment variables
          docker run -d \
            --name agent_smoke_test \
            -p 8080:8000 \
            -e ENVIRONMENT=production \
            -e LOG_LEVEL=INFO \
            -e AGENT_VERSION="0.1.0-smoke" \
            -e LLM_MODEL="$LLM_MODEL" \
            -e LLM_PROVIDER=transformers \
            -e LLM_TEMPERATURE=0.0 \
            -e LLM_MAX_TOKENS=8048 \
            -e DATABASE_URL=postgresql+asyncpg://test:test@localhost:5432/test \
            -e DATABASE_AUTO_CREATE_TABLES=false \
            -e CHROMA_MODE=ephemeral \
            -e CHROMA_COLLECTION=smoke_test_experiences \
            -e MCP_ROBOT_BACKEND=simulated \
            -e MCP_TRANSPORT=stdio \
            -e AGENT_MAX_PLAN_STEPS=12 \
            -e AGENT_MAX_ACTION_RETRIES=3 \
            -e AGENT_ENABLE_VERIFICATION=true \
            -e AGENT_ENABLE_MEMORY=false \
            -e EVALUATION_BASELINE=full_system \
            "$IMAGE_TAG"

          # Wait for container to start
          echo "Waiting for container to start..."
          sleep 10

          # Health check
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || echo "000")

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Health check passed: HTTP $RESPONSE"
            curl -s http://localhost:8080/health | python -m json.tool
          else
            echo "::error::❌ Health check failed with HTTP $RESPONSE"
            docker logs agent_smoke_test
            exit 1
          fi

          # Optional: Run a simple task to verify full functionality
          echo "Running a simple task..."
          TASK_RESPONSE=$(curl -s -X POST http://localhost:8080/tasks/run \
            -H "Content-Type: application/json" \
            -d '{"instruction":"Check the robot state","baseline":"baseline_a"}' \
            -w "\n%{http_code}" || echo -e "\n000")

          TASK_HTTP_CODE=$(echo "$TASK_RESPONSE" | tail -n1)
          TASK_BODY=$(echo "$TASK_RESPONSE" | sed '$d')

          if [ "$TASK_HTTP_CODE" = "200" ]; then
            echo "✅ Task execution passed: HTTP $TASK_HTTP_CODE"
            echo "$TASK_BODY" | python -m json.tool
          else
            echo "::warning::⚠️ Task execution returned HTTP $TASK_HTTP_CODE (non-critical)"
            echo "$TASK_BODY"
          fi

          # Cleanup
          docker stop agent_smoke_test
          docker rm agent_smoke_test

      - name: Verify image in registry
        run: |
          echo "✅ Image pushed successfully:"
          echo "  Registry: ${{ env.REGISTRY }}"
          echo "  Image: ${{ env.IMAGE_NAME }}"
          echo "  SHA: ${{ github.sha }}"
          echo "  Ref: ${{ github.ref }}"

  # ==================================================================
  # JOB 6: Pipeline Summary
  # ==================================================================
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, test, coverage-summary, evaluation, docker-build-push]
    if: always()

    steps:
      - name: Pipeline summary
        run: |
          echo "=========================================="
          echo "  CI/CD Pipeline Summary"
          echo "=========================================="
          echo "  Repository: ${{ github.repository }}"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Triggered by: ${{ github.event_name }}"
          echo "  Actor: ${{ github.actor }}"
          echo "=========================================="
          echo "  Lint: ${{ needs.lint.result }}"
          echo "  Test: ${{ needs.test.result }}"
          echo "  Coverage: ${{ needs.coverage-summary.result }}"
          echo "  Evaluation: ${{ needs.evaluation.result }}"
          echo "  Docker: ${{ needs.docker-build-push.result }}"
          echo "=========================================="

          # Write to GitHub Step Summary
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🚀 CI/CD Pipeline Summary

          | Job | Status |
          |-----|--------|
          | Lint | ${{ needs.lint.result == 'success' && '✅' || needs.lint.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.lint.result }} |
          | Test | ${{ needs.test.result == 'success' && '✅' || needs.test.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.test.result }} |
          | Coverage | ${{ needs.coverage-summary.result == 'success' && '✅' || needs.coverage-summary.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.coverage-summary.result }} |
          | Evaluation | ${{ needs.evaluation.result == 'success' && '✅' || needs.evaluation.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.evaluation.result }} |
          | Docker | ${{ needs.docker-build-push.result == 'success' && '✅' || needs.docker-build-push.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.docker-build-push.result }} |

          **Repository**: \`${{ github.repository }}\`  
          **Branch**: \`${{ github.ref_name }}\`  
          **Commit**: \`${{ github.sha }}\`  
          **Actor**: \`${{ github.actor }}\`
          EOF
        
