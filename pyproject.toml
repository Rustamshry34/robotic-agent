[project]
name = "robotic-ai-agent"
version = "0.1.0"
description = "MCP-backed, self-verifying Robotic AI Agent"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "mcp_server", "memory", "evaluation", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "TCH",
    "RUF",
]

ignore = [
    "E501",
    "B008",
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]  

python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
